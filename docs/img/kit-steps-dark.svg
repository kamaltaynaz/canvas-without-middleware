<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The eight prompts, in order</title>
<desc id="d">Eight steps in order: ground rules, discovery, spec, build the core, bulk workbook, live form, test and roll out, and operate. You approve the result of each step before the agent moves to the next.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656c76"/></marker></defs>
<line x1="221" y1="85.0" x2="239" y2="85.0" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<line x1="451" y1="85.0" x2="469" y2="85.0" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<line x1="681" y1="85.0" x2="699" y2="85.0" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<line x1="221" y1="245.0" x2="239" y2="245.0" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<line x1="451" y1="245.0" x2="469" y2="245.0" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<line x1="681" y1="245.0" x2="699" y2="245.0" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<path d="M805.0 153 V165 H115.0 V176" fill="none" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<rect x="12" y="20" width="206" height="130" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<circle cx="38" cy="48" r="12" fill="#4493f8"/>
<text x="38" y="52.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">0</text>
<text x="60" y="53.5" font-size="16" font-weight="700" fill="#f0f6fc">Ground rules</text>
<text x="28" y="81" font-size="13" fill="#f0f6fc">The agent loads the rules</text>
<text x="28" y="99" font-size="13" fill="#f0f6fc">for the whole build</text>
<text x="28" y="130" font-size="12.5" fill="#56d364" font-weight="600">You approve: the rules</text>
<rect x="242" y="20" width="206" height="130" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<circle cx="268" cy="48" r="12" fill="#4493f8"/>
<text x="268" y="52.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">1</text>
<text x="290" y="53.5" font-size="16" font-weight="700" fill="#f0f6fc">Discovery</text>
<text x="258" y="81" font-size="13" fill="#f0f6fc">The agent interviews you</text>
<text x="258" y="99" font-size="13" fill="#f0f6fc">and you pick a method</text>
<text x="258" y="130" font-size="12.5" fill="#56d364" font-weight="600">You approve: your answers</text>
<rect x="472" y="20" width="206" height="130" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<circle cx="498" cy="48" r="12" fill="#4493f8"/>
<text x="498" y="52.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">2</text>
<text x="520" y="53.5" font-size="16" font-weight="700" fill="#f0f6fc">Spec</text>
<text x="488" y="81" font-size="13" fill="#f0f6fc">The sheet, the steps and</text>
<text x="488" y="99" font-size="13" fill="#f0f6fc">the tokens, written down</text>
<text x="488" y="130" font-size="12.5" fill="#56d364" font-weight="600">You approve: the spec</text>
<rect x="702" y="20" width="206" height="130" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<circle cx="728" cy="48" r="12" fill="#4493f8"/>
<text x="728" y="52.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">3</text>
<text x="750" y="53.5" font-size="16" font-weight="700" fill="#f0f6fc">Build the core</text>
<text x="718" y="81" font-size="13" fill="#f0f6fc">Settings, Canvas calls and</text>
<text x="718" y="99" font-size="13" fill="#f0f6fc">steps safe to re-run</text>
<text x="718" y="130" font-size="12.5" fill="#56d364" font-weight="600">You approve: each piece</text>
<rect x="12" y="180" width="206" height="130" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<circle cx="38" cy="208" r="12" fill="#4493f8"/>
<text x="38" y="212.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">4</text>
<text x="60" y="213.5" font-size="16" font-weight="700" fill="#f0f6fc">Bulk workbook</text>
<text x="28" y="241" font-size="13" fill="#f0f6fc">Rows, a menu, dry runs</text>
<text x="28" y="259" font-size="13" fill="#f0f6fc">and pause and resume</text>
<text x="28" y="290" font-size="12.5" fill="#56d364" font-weight="600">You approve: the rehearsal</text>
<rect x="242" y="180" width="206" height="130" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<circle cx="268" cy="208" r="12" fill="#4493f8"/>
<text x="268" y="212.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">5</text>
<text x="290" y="213.5" font-size="16" font-weight="700" fill="#f0f6fc">Live form</text>
<text x="258" y="241" font-size="13" fill="#f0f6fc">Optional: a request</text>
<text x="258" y="259" font-size="13" fill="#f0f6fc">builds a course at once</text>
<text x="258" y="290" font-size="12.5" fill="#56d364" font-weight="600">You approve: the trade-offs</text>
<rect x="472" y="180" width="206" height="130" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<circle cx="498" cy="208" r="12" fill="#4493f8"/>
<text x="498" y="212.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">6</text>
<text x="520" y="213.5" font-size="16" font-weight="700" fill="#f0f6fc">Test and roll out</text>
<text x="488" y="241" font-size="13" fill="#f0f6fc">Test Canvas first, then</text>
<text x="488" y="259" font-size="13" fill="#f0f6fc">production in small steps</text>
<text x="488" y="290" font-size="12.5" fill="#56d364" font-weight="600">You approve: every stage</text>
<rect x="702" y="180" width="206" height="130" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<circle cx="728" cy="208" r="12" fill="#4493f8"/>
<text x="728" y="212.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">7</text>
<text x="750" y="213.5" font-size="16" font-weight="700" fill="#f0f6fc">Operate</text>
<text x="718" y="241" font-size="13" fill="#f0f6fc">A runbook for next term</text>
<text x="718" y="259" font-size="13" fill="#f0f6fc">and for token care</text>
<text x="718" y="290" font-size="12.5" fill="#56d364" font-weight="600">You approve: the runbook</text>
</svg>
